<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juego del Número Secreto</title>
    <!-- Usa la misma hoja de estilos principal -->
    <link rel="stylesheet" href="styles-pro.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="main-header">
      <div class="logo">Geovan Pérez</div>
      <nav class="menu-superior">
        <a href="index.html">Inicio</a>
        <a href="sobre-mi.html">Sobre mí</a>
        <a href="curriculum.html">Currículum</a>
        <a href="mis-proyectos.html">Proyectos</a>
      </nav>
    </header>

    <section class="juego-contenedor">
      <!-- Columna Izquierda: Interfaz del juego -->
      <div class="interfaz-juego">
        <h1>Juego del <span class="resaltado">número secreto!</span></h1>

        <p class="instruccion">
          Indica un número del 1 al 10. Tienes 3 intentos.
        </p>

        <input
          type="number"
          id="numeroUsuario"
          class="campo-numero"
          min="1"
          max="10"
          required
        />

        <!-- Contenedor para mensajes de feedback -->
        <p id="mensaje" class="mensaje-feedback">¡Adivina el número!</p>

        <!-- Botones -->
        <div class="botones-juego">
          <button id="btnIntentar" class="btn-juego btn-intentar">
            <i class="fas fa-check"></i> Intentar
          </button>
          <button id="btnNuevoJuego" class="btn-juego btn-nuevo" disabled>
            <i class="fas fa-redo"></i> Nuevo juego
          </button>
        </div>
      </div>

      <!-- Columna Derecha: Imagen del Mago -->
      <div class="imagen-mago">
        <!-- La imagen debe llamarse 'mago.png' o 'mago.jpg' -->
        <img
          src="mago-sumon.webp"
          alt="Mago del Número Secreto"
          class="imagen-proyecto"
        />
      </div>
    </section>

    <footer class="main-footer">
      Desarrollado y diseñado por Geovan Yassil Pérez Encarnación
    </footer>

    <!-- Archivo JavaScript para la lógica del juego -->
    <script src="juego.js"></script>
  </body>
</html>
