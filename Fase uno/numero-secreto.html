<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juego del Número Secreto</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="juego.css" />
  </head>
  <body>
    <header>
      <nav class="menu-superior">
        <a href="inicio.html">Inicio</a>
        <a href="sobre-mi.html">Sobre mí</a>
        <a href="curriculum.html">Currículum</a>
        <a href="mis-proyectos.html">Mis Proyectos</a>
      </nav>
    </header>

    <section class="juego-contenedor">
      <div class="interfaz-juego">
        <h1>Juego del <br /><span class="resaltado">número secreto!</span></h1>

        <p class="instruccion">Indica un número del 1 al 10</p>

        <input
          type="number"
          id="numeroUsuario"
          class="campo-numero"
          min="1"
          max="10"
          required
        />

        <p id="mensaje" class="mensaje-feedback">¡Adivina el número!</p>

        <div class="botones-juego">
          <button id="btnIntentar" class="btn-juego btn-intentar">
            Intentar
          </button>
          <button id="btnNuevoJuego" class="btn-juego btn-nuevo" disabled>
            Nuevo juego
          </button>
        </div>
      </div>

      <div class="imagen-mago">
        <img
          src="mago-sumon.webp"
          alt="Mago del Número Secreto"
          class="imagen-proyecto"
        />
      </div>
    </section>

    <footer>Desarrollado por Geovan Yassil Pérez Encarnación</footer>

    <script src="juego.js"></script>
  </body>
</html>
